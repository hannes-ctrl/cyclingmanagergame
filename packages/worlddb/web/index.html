<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radmanager · Database</title>
<style>
/* The same basic look as the interface draft: sidebar in the team colour, tinted panels, dense tables. */
:root{--bg:#15122a;--fg:#eeecf7;--mut:#a59fc8;--team:#33206e;--side-fg:#ffffff;--acc:#f7d417;--acc-fg:#1b1600;
  --gold:#f7d417;--gruen:#44c285;--rot:#ef6258;--blau:#6db3ff;
  --panel:color-mix(in srgb,var(--team) 12%,var(--bg));--panel2:color-mix(in srgb,var(--team) 26%,var(--bg));
  --line:color-mix(in srgb,var(--mut) 30%,var(--panel2));color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 "Segoe UI",Arial,sans-serif;display:grid;grid-template-columns:230px minmax(0,1fr)}
h1,h2,h3{margin:0;font-weight:600;line-height:1.2} h1{font-size:17px} h2{font-size:20px} h3{font-size:15px}
.mut{color:var(--mut)} .small{font-size:12.5px}
.lbl{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
aside{background:var(--team);color:var(--side-fg);display:flex;flex-direction:column;min-height:0}
aside header{padding:12px}
.modes{display:flex;gap:4px;padding:0 8px 8px}
.modes button{flex:1;background:none;border:1px solid color-mix(in srgb,var(--side-fg) 35%,transparent);border-radius:4px;padding:4px;color:var(--side-fg)}
.modes button[aria-pressed=true]{background:var(--acc);color:var(--acc-fg);border-color:var(--acc);font-weight:600}
aside input{margin:0 8px 8px;padding:5px 8px;border-radius:4px;border:0;background:color-mix(in srgb,var(--side-fg) 14%,transparent);color:var(--side-fg);font:inherit}
aside input::placeholder{color:color-mix(in srgb,var(--side-fg) 65%,transparent)}
#list{overflow:auto;flex:1;padding:0 4px 8px}
#list .grp{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:color-mix(in srgb,var(--side-fg) 65%,transparent);padding:10px 8px 2px}
#list button{display:flex;gap:8px;align-items:center;width:100%;background:none;border:0;text-align:left;padding:4px 8px;border-radius:4px;color:var(--side-fg)}
#list button:hover{background:color-mix(in srgb,var(--side-fg) 14%,transparent)}
#list button[aria-current=true]{background:var(--acc);color:var(--acc-fg);font-weight:600}
#list span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
#list span.r{font-size:12px;opacity:.75;font-variant-numeric:tabular-nums}
.sw{width:10px;height:14px;border-radius:2px;border:1px solid color-mix(in srgb,var(--side-fg) 55%,transparent);flex:none}
main{min-width:0;overflow:auto;display:flex;flex-direction:column}
.bar{position:sticky;top:0;z-index:2;background:var(--panel2);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:4px 18px;align-items:baseline}
.pad{padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.pad>*,#stage>*{min-width:0}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);text-align:left;padding:5px 7px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--panel);cursor:pointer}
td{padding:4px 7px;border-bottom:1px solid var(--line);white-space:nowrap}
td.n,th.n{text-align:right}
tr.pick{cursor:pointer} tr.pick:hover td{background:var(--panel2)} tr.sel td{background:var(--panel2);box-shadow:inset 0 -2px var(--acc)}
.a1{color:var(--mut)} .a3{color:var(--gruen);font-weight:600} .a4{color:var(--gold);font-weight:600}
.box{border:1px solid var(--line);border-radius:4px;padding:12px;background:var(--panel);display:flex;flex-direction:column;gap:8px;min-width:0}
.cols{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))} .cols>*{min-width:0}
.pill{display:inline-block;border-radius:3px;padding:0 6px;font-size:11px;font-weight:600;line-height:1.6;border:1px solid var(--line)}
.pill.y{border-color:var(--gold);color:var(--gold)} .pill.r{border-color:var(--rot);color:var(--rot)} .pill.b{border-color:var(--blau);color:var(--blau)} .pill.g{border-color:var(--gruen);color:var(--gruen)}
svg text{font-family:"Segoe UI",Arial,sans-serif}
@media (max-width:760px){body{grid-template-columns:minmax(0,1fr);grid-template-rows:260px minmax(0,1fr)}}
</style>
</head>
<body>
<aside id="side">
  <header><h1>Radmanager</h1><span class="small" style="opacity:.8">Database browser · WorldDB 2026</span></header>
  <div class="modes"><button id="m-teams" aria-pressed="true">Teams</button><button id="m-races" aria-pressed="false">Races</button></div>
  <input id="filter" type="search" placeholder="Filtern …" aria-label="Filter the list">
  <div id="list"></div>
</aside>
<main id="main"><div class="pad mut">Loading …</div></main>
<script>
/**
 * Database browser for the world database. Talks to the JSON API of
 * `worlddb serve` and renders teams, riders, races and stage profiles.
 */

/**
 * @param {string} s CSS selector.
 * @returns {Element|null} The first matching element.
 */
const $=s=>document.querySelector(s);
/**
 * Replaces the content of an element.
 * @param {Element} el Target element.
 * @param {string} h HTML to insert; values must already be escaped.
 */
const H=(el,h)=>{el.innerHTML=h};
/**
 * @param {*} s Any value.
 * @returns {string} The value as text, safe to put into HTML.
 */
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/**
 * Calls the JSON API.
 * @param {string} p Endpoint with query string, e.g. `riders?id=12`.
 * @returns {Promise<*>} The parsed response.
 * @throws {Error} If the server answers with an error status.
 */
const api=(p)=>fetch("/api/"+p).then(r=>{if(!r.ok)throw new Error(p+": "+r.status);return r.json()});
/** View state: list mode, loaded data, selection and sort order. */
const state={mode:"teams",teams:[],races:[],sel:null,sort:{key:"last_name",dir:1},riders:[],stage:null};

/** Display names of the WorldDB divisions, in list order. */
const DIV={"[1] World Tour":"WorldTeams","[2] Pro Tour":"ProTeams","[3] Continental Tour":"Continental","Under23":"U23","Free":"Free agents"};
/** Race class patterns of the WorldDB and the group they are listed under. */
const CLS=[[/^CWTGT/,"Grand Tours"],[/^CWTMaj/,"Monuments"],[/^CWT/,"WorldTour"],[/HC$/,"ProSeries"],[/^Cont[12]1$/,"Class 1"],[/^Cont[12]2U$/,"U23"],[/^Cont[12]2$/,"Class 2"],[/ITT$/,"Time trial championships"],[/Championship/,"Championships"]];
/**
 * @param {string} c Race class of the WorldDB.
 * @returns {string} The group label, or the class itself if none matches.
 */
const clsName=c=>(CLS.find(x=>x[0].test(c))||[0,c])[1];
/**
 * @param {number} mmdd Date as month * 100 + day.
 * @returns {string} `dd.mm.`, or an empty string without a date.
 */
const date=mmdd=>mmdd?String(mmdd%100).padStart(2,"0")+"."+String(Math.floor(mmdd/100)).padStart(2,"0")+".":"";

/** Renders the sidebar list of teams or races, honouring the filter field. */
function renderList(){
  const f=$("#filter").value.toLowerCase(); let html="",last=null;
  if(state.mode==="teams"){
    for(const t of state.teams){ if(f&&!(t.name+t.abbr).toLowerCase().includes(f))continue;
      const g=DIV[t.division]||t.division; if(g!==last){html+=`<div class="grp">${esc(g)}</div>`;last=g}
      html+=`<button data-team="${t.id}" aria-current="${state.sel===t.id}"><span class="sw" style="background:linear-gradient(#${esc(t.color)} 50%,#${esc(t.color2)} 50%)"></span><span class="t">${esc(t.name)}</span><span class="r">${t.riders}</span></button>`;}
  } else {
    const order=["Grand Tours","Monuments","WorldTour","ProSeries","Class 1","Class 2","U23","Championships","Time trial championships"];
    const groups={}; for(const r of state.races){ if(f&&!r.name.toLowerCase().includes(f))continue; (groups[clsName(r.class)]??=[]).push(r); }
    for(const g of [...order,...Object.keys(groups).filter(k=>!order.includes(k))]){ if(!groups[g])continue;
      html+=`<div class="grp">${esc(g)} · ${groups[g].length}</div>`+groups[g].map(r=>`<button data-race="${r.id}" aria-current="${state.sel===r.id}"><span class="t">${esc(r.name)}</span><span class="r">${date(r.start_mmdd)}</span></button>`).join("");}
  }
  H($("#list"),html||`<div class="grp">Nothing found</div>`);
}

/** Rider attribute columns: database field and German column heading. */
const ATTR=[["flat","FL"],["mountain","MTN"],["medium_mountain","MED"],["hill","HIL"],["time_trial","TT"],["prologue","PRL"],["cobble","COB"],["sprint","SPR"],["acceleration","ACC"],["downhill","DH"],["breakaway","BRK"],["endurance","STA"],["resistance","RES"],["recovery","REC"]];
/**
 * @param {number} v A rider attribute.
 * @returns {string} CSS class that colours the value.
 */
const ac=v=>v>=78?"a4":v>=72?"a3":v>=65?"":"a1";
/**
 * @param {number} b Date of birth as YYYYMMDD.
 * @returns {number} Age in the 2026 season.
 */
const age=b=>2026-Math.floor(b/10000);

/**
 * Selects a team, tints the page in its colours and loads its riders.
 * @param {number} id Team id.
 * @returns {Promise<void>}
 */
async function showTeam(id){
  state.sel=id; renderList(); const t=state.teams.find(x=>x.id===id);
  document.documentElement.style.setProperty("--team","#"+t.color);
  // Text colour follows the brightness of the surface underneath, otherwise
  // it is unreadable on light team colours (white, yellow).
  const lum=hex=>{const c=parseInt(hex,16);return (0.299*(c>>16)+0.587*(c>>8&255)+0.114*(c&255))/255};
  const on=hex=>lum(hex)>0.55?"#15122a":"#ffffff", root=document.documentElement.style;
  // The accent is the secondary colour. If it hardly stands out from the
  // team colour, the selection uses the sidebar's text colour instead.
  const acc=Math.abs(lum(t.color)-lum(t.color2))<0.2?on(t.color).slice(1):t.color2;
  root.setProperty("--side-fg",on(t.color));
  root.setProperty("--acc","#"+acc);
  root.setProperty("--acc-fg",on(acc));
  state.riders=await api("riders?id="+id); renderTeam(t);
}
/**
 * Renders the squad table of a team in the current sort order.
 * @param {Object} t Team row from the API.
 */
function renderTeam(t){
  const {key,dir}=state.sort; const rows=[...state.riders].sort((a,b)=>(a[key]>b[key]?1:a[key]<b[key]?-1:0)*dir);
  const th=(k,l,n)=>`<th class="${n?"n":""}" data-sort="${k}">${l}${key===k?(dir>0?" ▲":" ▼"):""}</th>`;
  H($("#main"),`<div class="bar"><h2>${esc(t.name)}</h2><span class="mut">${esc(t.abbr)} · ${esc(DIV[t.division]||t.division)} · ${esc(t.country)} · ${rows.length} riders · Manager ${esc(t.manager)}</span></div>
  <div class="pad"><div class="scroll"><table><tr>${th("last_name","Rider")}${th("country","Nat")}${th("birthdate","Age",1)}${th("potential","Pot",1)}${ATTR.map(a=>th(a[0],a[1],1)).join("")}${th("contract_end","Contract",1)}</tr>
  ${rows.map(r=>`<tr><td>${esc(r.last_name)} <span class="mut">${esc(r.first_name)}</span></td><td class="mut">${esc(r.country)}</td><td class="n">${age(r.birthdate)}</td><td class="n">${r.potential}</td>${ATTR.map(a=>`<td class="n ${ac(r[a[0]])}">${r[a[0]]}</td>`).join("")}<td class="n">${r.contract_end||"–"}</td></tr>`).join("")}</table></div>
  <p class="small mut">Values of the WorldDB. Wages, budgets and, for most riders, the rider type are empty there; the game makes them.</p></div>`);
}

/**
 * Selects a race and shows its stages.
 * @param {number} id Race id.
 * @returns {Promise<void>}
 */
async function showRace(id){
  state.sel=id; renderList(); const r=state.races.find(x=>x.id===id); const stages=await api("stages?id="+id);
  state.stages=stages; state.race=r;
  H($("#main"),`<div class="bar"><h2>${esc(r.name)}</h2><span class="mut">${esc(clsName(r.class))} · ${esc(r.country)} · ${stages.length>1?stages.length+" stages":"One-day race"} · from ${date(r.start_mmdd)}</span></div>
  <div class="pad"><div class="scroll"><table id="stages"><tr><th class="n">No.</th><th>Date</th><th>Route</th><th class="n">km</th><th class="n">Hm</th><th class="n">Highest point</th><th>Year</th><th>Source</th></tr>
  ${stages.map(s=>`<tr class="pick" data-stage="${s.id}"><td class="n">${s.number}</td><td>${String(s.day).padStart(2,"0")}.${String(s.month).padStart(2,"0")}.</td><td>${esc(s.name||"no route file")}</td><td class="n">${s.race_km?.toFixed(1)??""}</td><td class="n">${s.elevation_gain_m!=null?Math.round(s.elevation_gain_m):""}</td><td class="n">${s.max_altitude_m!=null?Math.round(s.max_altitude_m)+" m":""}</td><td>${s.variant==="2026"?"2026":`<span class="pill y">${esc(s.variant||"no year")}</span>`}</td><td class="mut">${s.source==="game"?"Base game":"WorldDB"}</td></tr>`).join("")}</table></div>
  <div id="stage"></div></div>`);
  if(stages.length) showStage(stages[0].id);
}

/** Labels of the mountain prize categories by their code in the stage file. */
const CAT=["","HC","1","2","3","4"];
/**
 * Shows the profile, climbs, sectors and waypoints of a stage.
 * @param {number} id Stage id.
 * @returns {Promise<void>}
 */
async function showStage(id){
  document.querySelectorAll("#stages tr").forEach(tr=>tr.classList.toggle("sel",tr.dataset.stage==id));
  const s=await api("stage?id="+id); if(!s){H($("#stage"),"");return}
  const P=s.profile.filter(p=>p[0]>=0&&p[0]<=s.race_km); const maxAlt=Math.max(...P.map(p=>p[1]),100), top=Math.ceil(maxAlt/500)*500;
  const W=1000,Hh=250,L=44,R=14,T=38,B=28, x=k=>L+k/s.race_km*(W-L-R), y=a=>Hh-B-Math.max(a,0)/top*(Hh-T-B);
  const altAt=k=>{let best=P[0];for(const p of P){if(Math.abs(p[0]-k)<Math.abs(best[0]-k))best=p}return best[1]};
  const kmStep=s.race_km>120?20:s.race_km>40?10:5; const ticks=[];for(let k=0;k<=s.race_km;k+=kmStep)ticks.push(k);
  const marks=s.waypoints.filter(w=>w.type==="climb"||w.type==="sprint"||w.type==="summitFinish");
  const svg=`<svg viewBox="0 0 ${W} ${Hh}" style="min-width:640px;width:100%;display:block" role="img" aria-label="Altitude profile ${esc(s.name)}">
  ${[...Array(top/500+1).keys()].map(i=>`<line x1="${L}" x2="${W-R}" y1="${y(i*500)}" y2="${y(i*500)}" stroke="var(--line)"/><text x="${L-6}" y="${y(i*500)+4}" font-size="11" text-anchor="end" fill="var(--mut)">${i*500}</text>`).join("")}
  ${s.sectors.map(c=>`<rect x="${x(c.from_race_km)}" y="${T}" width="${Math.max(1.5,x(c.to_race_km)-x(c.from_race_km))}" height="${Hh-T-B}" fill="${c.cobbled?"var(--rot)":"var(--gold)"}" opacity="${0.2+c.difficulty*0.1}"><title>${esc(c.name)} · ${c.difficulty} of 5</title></rect>`).join("")}
  <polygon points="${x(0)},${y(0)} ${P.map(p=>x(p[0]).toFixed(1)+","+y(p[1]).toFixed(1)).join(" ")} ${x(s.race_km)},${y(0)}" fill="var(--panel2)" stroke="var(--fg)" stroke-width="1.2"/>
  ${ticks.map(k=>`<line x1="${x(k)}" x2="${x(k)}" y1="${Hh-B}" y2="${Hh-B+4}" stroke="var(--mut)"/><text x="${x(k)}" y="${Hh-8}" font-size="11" text-anchor="middle" fill="var(--mut)">${k}</text>`).join("")}
  ${marks.map(w=>{const cx=x(w.race_km),cy=y(altAt(w.race_km)),spr=w.type==="sprint";return `<line x1="${cx}" x2="${cx}" y1="${cy}" y2="${T-6}" stroke="${spr?"var(--gruen)":"var(--rot)"}" stroke-dasharray="2 3"/><circle cx="${cx}" cy="${T-14}" r="9" fill="${spr?"var(--gruen)":"var(--rot)"}"><title>${esc(w.name)} · km ${w.race_km.toFixed(1)}</title></circle><text x="${cx}" y="${T-10}" font-size="10" font-weight="700" text-anchor="middle" fill="#15122a">${spr?"S":CAT[w.detail]||"?"}</text>`}).join("")}
  </svg>`;
  const climbs=s.climbs.filter(c=>c.kind===0);
  H($("#stage"),`<div class="box"><div style="display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;justify-content:space-between"><h3>${esc(s.name)}</h3><span class="mut small">${s.race_km.toFixed(1)} km · ${Math.round(s.elevation_gain_m)} m climbing · highest point ${Math.round(s.max_altitude_m)} m · file ${esc(s.file)}${s.has_details?"":" · classifications unreadable"}</span></div>
  <div class="scroll">${svg}</div>
  <div class="small mut">Red marks: categorised climbs. Green: sprints and time checks. Red background: cobbles, yellow: gravel.</div></div>
  <div class="cols" style="margin-top:14px">
  ${climbs.length?`<div class="box"><span class="lbl">Climbs</span><table><tr><th>Name</th><th class="n">to km</th><th class="n">Length</th><th class="n">Ø</th><th class="n">max</th></tr>${climbs.map(c=>`<tr><td>${esc(c.name)}</td><td class="n">${c.to_race_km.toFixed(1)}</td><td class="n">${(c.to_race_km-c.from_race_km).toFixed(1)} km</td><td class="n">${c.avg_gradient.toFixed(1)} %</td><td class="n">${c.max_gradient.toFixed(1)} %</td></tr>`).join("")}</table></div>`:""}
  ${s.sectors.length?`<div class="box"><span class="lbl">Sectors · ${s.sectors.length}</span><table><tr><th>Name</th><th class="n">from km</th><th class="n">Length</th><th>Difficulty</th></tr>${s.sectors.map(c=>`<tr><td>${esc(c.name)}</td><td class="n">${c.from_race_km.toFixed(1)}</td><td class="n">${Math.round((c.to_race_km-c.from_race_km)*1000)} m</td><td class="${c.difficulty>=5?"a4":c.difficulty>=4?"a3":""}">${"★".repeat(c.difficulty)}</td></tr>`).join("")}</table></div>`:""}
  <div class="box"><span class="lbl">Waypoints</span><table><tr><th class="n">km</th><th>Kind</th><th>Place</th></tr>${s.waypoints.filter(w=>w.type!=="feedZone").map(w=>`<tr><td class="n">${w.race_km.toFixed(1)}</td><td>${({start:"Start",timeTrialStart:"Time trial start",teamTimeTrialStart:"Team time trial start",finish:"Finish",summitFinish:"Summit finish "+(CAT[w.detail]||""),sprint:w.detail===16?"Time check":"Sprint",climb:"Climb "+(CAT[w.detail]||"")})[w.type]||esc(w.type)}</td><td>${esc(w.name)}</td></tr>`).join("")}</table></div></div>`);
}

// One click handler for the whole page: list entries, stage rows, sortable
// column heads and the two mode buttons.
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-team],[data-race],[data-stage],[data-sort],#m-teams,#m-races"); if(!b)return;
  if(b.dataset.team) showTeam(+b.dataset.team);
  else if(b.dataset.race) showRace(+b.dataset.race);
  else if(b.dataset.stage) showStage(+b.dataset.stage);
  else if(b.dataset.sort){const k=b.dataset.sort;state.sort=state.sort.key===k?{key:k,dir:-state.sort.dir}:{key:k,dir:k==="last_name"||k==="country"?1:-1};renderTeam(state.teams.find(t=>t.id===state.sel));}
  else {state.mode=b.id==="m-teams"?"teams":"races";state.sel=null;$("#m-teams").setAttribute("aria-pressed",state.mode==="teams");$("#m-races").setAttribute("aria-pressed",state.mode==="races");$("#filter").value="";renderList();}
});
$("#filter").addEventListener("input",renderList);
// Initial load: teams and races, then the first WorldTeam.
(async()=>{
  try{ [state.teams,state.races]=await Promise.all([api("teams"),api("races")]);
    const rank=Object.keys(DIV); state.teams.sort((a,b)=>rank.indexOf(a.division)-rank.indexOf(b.division)||a.name.localeCompare(b.name)); renderList(); showTeam(state.teams.find(t=>t.division==="[1] World Tour").id); }
  catch(err){ H($("#main"),`<div class="pad">The world database cannot be reached: ${esc(err.message)}. Is <code>worlddb serve</code> running, and was <code>worlddb import</code> run before?</div>`); }
})();
</script>
</body>
</html>
